name: CI/CD Docker

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build e Push da imagem
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/einfo-devops-2026/projeto01:latest


  deploy:
    name: Deploy na VPS
    needs: build
    runs-on: self-hosted

    steps:
      - name: Atualizar aplicação
        run: |
          cd /home/gustavo/lab-einfo/projeto01
          docker compose pull
          docker compose up -d